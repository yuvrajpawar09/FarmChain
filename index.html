<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmChain - Blockchain Agricultural Supply Chain</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <header>
            <h1>🌾 FarmChain</h1>
            <p>Blockchain Agricultural Supply Chain</p>
        </header>

        <!-- Role Selector -->
        <section class="role-selector">
            <label for="userRole">Select your role:</label>
            <select id="userRole">
                <option value="">-- Choose --</option>
                <option value="farmer">Farmer</option>
                <option value="distributor">Distributor</option>
                <option value="retailer">Retailer</option>
                <option value="consumer">Consumer</option>
            </select>
        </section>

        <!-- Farmer -->
        <section id="farmer" class="role-content hidden">
            <h2>Farmer Dashboard</h2>
            <form id="farmerForm">
                <input type="text" id="cropType" placeholder="Crop Type" required>
                <input type="number" id="quantity" placeholder="Quantity (kg)" required>
                <input type="date" id="harvestDate" required>
                <input type="text" id="farmLocation" placeholder="Farm Location" required>
                <button type="submit">Register Product</button>
            </form>
            <div class="result" id="farmerResult"></div>
        </section>

        <!-- Distributor -->
        <section id="distributor" class="role-content hidden">
            <h2>Distributor Dashboard</h2>
            <input type="text" id="productId" placeholder="Enter Product ID">
            <div class="btn-group">
                <button id="verifyBtn">Verify Product</button>
                <button id="logisticsBtn">Update Logistics</button>
            </div>
            <div class="result" id="distributorResult"></div>
        </section>

        <!-- Retailer -->
        <section id="retailer" class="role-content hidden">
            <h2>Retailer Dashboard</h2>
            <input type="text" id="retailerProductId" placeholder="Enter Product ID">
            <div class="btn-group">
                <button id="authBtn">Check Authenticity</button>
                <button id="inventoryBtn">Update Inventory</button>
            </div>
            <div class="result" id="retailerResult"></div>
        </section>

        <!-- Consumer -->
        <section id="consumer" class="role-content hidden">
            <h2>Consumer Portal</h2>
            <input type="text" id="qrCode" placeholder="Enter QR Code / Product ID">
            <button id="scanBtn">Scan Product</button>
            <div class="result" id="consumerResult"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
